name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore CsvRegression.slnx

      - run: dotnet build CsvRegression.slnx --no-restore --configuration Release

      - run: dotnet test CsvRegression.slnx --no-build --configuration Release
